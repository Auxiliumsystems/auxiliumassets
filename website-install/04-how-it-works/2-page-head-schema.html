tems.com/how-it-works#faq","mainEntity":[{"@type":"Question","name":"How fast does Auxilium reply to gym enquiries?","acceptedAnswer":{"@type":"Answer","text":"Within seconds, at any hour. At Space Gyms, half of all bookings in the first 30 days came in after staffed hours, when nobody would otherwise have replied until the next day."}},{"@type":"Question","name":"Which channels does the assistant answer?","acceptedAnswer":{"@type":"Answer","text":"Your website chat, Instagram and Facebook messages, WhatsApp and SMS, plus calls you miss, which get an instant text back. Every conversation lands in one inbox your team can see and step into."}},{"@type":"Question","name":"Can the assistant use my gym's name and personality?","acceptedAnswer":{"@type":"Answer","text":"Yes. Each gym names its own assistant and sets its tone. At Space Gyms she is called Aria. The assistant writes like your best front-desk person on a good day."}},{"@type":"Question","name":"How long does setup take?","acceptedAnswer":{"@type":"Answer","text":"Typically three to six weeks from sign-up to live. We build it, train the assistant on your gym, connect your channels and calendar, and train your team. You answer an onboarding questionnaire and approve the assistant's voice."}}]}]}</script>
