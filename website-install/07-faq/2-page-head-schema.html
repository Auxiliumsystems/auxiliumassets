<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://www.auxiliumsystems.com/faq#webpage","url":"https://www.auxiliumsystems.com/faq","name":"FAQ: AI enquiry assistant for gyms | Auxilium","description":"Answers on how Auxilium replies to gym enquiries 24/7, AI disclosure under the EU AI Act, GDPR, setup time, CRM handover and pricing.","isPartOf":{"@id":"https://www.auxiliumsystems.com/#website"},"about":{"@id":"https://www.auxiliumsystems.com/#org"},"inLanguage":"en-IE","dateModified":"2026-11-15","breadcrumb":{"@id":"https://www.auxiliumsystems.com/faq#breadcrumb"}},{"@type":"BreadcrumbList","@id":"https://www.auxiliumsystems.com/faq#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.auxiliumsystems.com/"},{"@type":"ListItem","position":2,"name":"FAQ","item":"https://www.auxiliumsystems.com/faq"}]},{"@type":"FAQPage","@id":"https://www.auxiliumsystems.com/faq#faq","mainEntity":[{"@type":"Question","name":"What is Auxilium?","acceptedAnswer":{"@type":"Answer","text":"Auxilium is a done-for-you enquiry response service for gyms and leisure centres in Ireland. A digital assistant replies to every enquiry in seconds, 24 hours a day, asks a few qualifying questions, books a visit into your calendar and gives your coach the answers before the person arrives. Once they join, their details go into your existing membership system."}},{"@type":"Question","name":"Is Auxilium a chatbot?","acceptedAnswer":{"@type":"Answer","text":"No. A chatbot answers questions; Auxilium is the front door for your gym's sales. It replies across your website, Instagram, Facebook, WhatsApp and SMS, qualifies the person, books the visit, sends reminders, follows up with people who go quiet and asks happy members for Google reviews. It is set up and run for you rather than a tool you configure yourself."}},{"@type":"Question","name":"Who is Auxilium for?","acceptedAnswer":{"@type":"Answer","text":"Independent gyms, leisure centres and multi-site gym operators in Ireland. It suits any operator that gets enquiries outside staffed hours, relies on tours, trials or consults to sell memberships, and wants every lead answered without hiring more front-desk staff."}},{"@type":"Question","name":"Where is Auxilium based?","acceptedAnswer":{"@type":"Answer","text":"Auxilium is based at the Airside Enterprise Centre in Swords, Co. Dublin, and works with gyms and leisure centres across Ireland."}},{"@type":"Question","name":"How fast does Auxilium reply to gym enquiries?","acceptedAnswer":{"@type":"Answer","text":"Within seconds, at any hour. At Space Gyms, half of all bookings in the first 30 days came in after staffed hours, when nobody would otherwise have replied until the next day."}},{"@type":"Question","name":"Which channels does the assistant answer?","acceptedAnswer":{"@type":"Answer","text":"Your website chat, Instagram and Facebook messages, WhatsApp and SMS, plus calls you miss, which get an instant text back. Every conversation lands in one inbox your team can see and step into."}},{"@type":"Question","name":"Will people know they are talking to an AI?","acceptedAnswer":{"@type":"Answer","text":"Yes. Every Auxilium assistant says it is a digital assistant in its very first message, before it asks anything. That is what the EU AI Act's transparency rules (Article 50) require, and members don't mind: at one client gym, members name the assistant in their Google reviews and thank it alongside the team."}},{"@type":"Question","name":"Does the assistant quote membership prices?","acceptedAnswer":{"@type":"Answer","text":"Not unless you want it to. By default it books the visit and mentions you have an offer on, so the price conversation happens in person with your team, where it converts best."}},{"@type":"Question","name":"What happens if the assistant doesn't know an answer?","acceptedAnswer":{"@type":"Answer","text":"It only answers from what it has been trained on for your gym. Anything else is handed to a member of your team, and the person is told someone will get back to them."}},{"@type":"Question","name":"Can the assistant use my gym's name and personality?","acceptedAnswer":{"@type":"Answer","text":"Yes. Each gym names its own assistant and sets its tone. At Space Gyms she is called Aria. The assistant writes like your best front-desk person on a good day."}},{"@type":"Question","name":"Do I need to change my membership software or CRM?","acceptedAnswer":{"@type":"Answer","text":"No. Auxilium works before someone becomes a member. When they join, their details are pushed into the system you already use, the same way a web form would. You keep your CRM, your billing and your access control."}},{"@type":"Question","name":"How long does setup take?","acceptedAnswer":{"@type":"Answer","text":"Typically three to six weeks from sign-up to live. We build it, train the assistant on your gym, connect your channels and calendar, and train your team. You answer an onboarding questionnaire and approve the assistant's voice."}},{"@type":"Question","name":"Does it work for leisure centres and multi-site operators?","acceptedAnswer":{"@type":"Answer","text":"Yes. Leisure centres use it to route enquiries across gym, pool, classes and swim lessons. Multi-site operators get one assistant per site with a combined dashboard, and multi-site pricing."}},{"@type":"Question","name":"How does Auxilium handle data and GDPR?","acceptedAnswer":{"@type":"Answer","text":"We act as your data processor and sign a data processing agreement with every gym before go-live. Enquiry data is held in your own Auxilium account, is never sold or shared, and is only passed into your membership system when someone joins."}},{"@type":"Question","name":"How much does Auxilium cost?","acceptedAnswer":{"@type":"Answer","text":"€399 per site per month plus a one-off €1,000 onboarding fee, both excluding VAT. Right now we waive the onboarding fee if you pay the first two months up front. Multi-site pricing is available."}},{"@type":"Question","name":"Is there a minimum contract?","acceptedAnswer":{"@type":"Answer","text":"No lock-in. It is a rolling monthly agreement. We would rather keep you because the assistant is booking visits than because a contract says so."}},{"@type":"Question","name":"Why does replying fast matter so much for gyms?","acceptedAnswer":{"@type":"Answer","text":"Because people shop around. Someone looking for a gym usually messages two or three at once, and the first to reply tends to win the visit. The MIT Lead Response Management Study found leads contacted within five minutes were 21 times more likely to qualify than those contacted after thirty minutes."}},{"@type":"Question","name":"What is speed to lead?","acceptedAnswer":{"@type":"Answer","text":"Speed to lead is the time between someone enquiring and your business replying. For gyms it is the single biggest lever on how many enquiries turn into visits, because interest fades in minutes, not days."}}]}]}</script>
