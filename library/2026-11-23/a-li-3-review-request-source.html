<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:local('Poppins Regular'),local('Poppins-Regular');font-weight:400}
@font-face{font-family:P;src:local('Poppins Medium'),local('Poppins-Medium');font-weight:500}
@font-face{font-family:P;src:local('Poppins SemiBold'),local('Poppins-SemiBold');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ccc}
.s{width:1200px;height:1200px;background:#0B1E3F;color:#FFFFFF;font-family:P,Poppins,sans-serif;position:relative;overflow:hidden;padding:100px;display:flex;flex-direction:column}
.lab{font-weight:500;font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:#D1D9E6}
.hero{margin-top:90px;display:flex;align-items:baseline;gap:28px}
.hero .n{font-weight:600;font-size:300px;line-height:1;color:#2EE6C5}
.hero .u{font-weight:600;font-size:96px;line-height:1}
h1{font-weight:600;font-size:64px;line-height:1.15;margin-top:50px;max-width:960px}
.rule{width:300px;height:10px;border-radius:5px;background:#2EE6C5;margin-top:60px}
p{font-size:40px;line-height:1.4;margin-top:40px;max-width:820px}
.wave{position:absolute;right:-10px;bottom:-4px}
</style></head><body>
<section class="s" id="s1"><div class="lab">Google reviews</div>
<div class="hero"><span class="n">1</span><span class="u">hour</span></div>
<h1>Ask for the review within an hour of the tour.</h1>
<div class="rule"></div>
<p>Name the coach. Send the link. Ask once.</p>
<svg class="wave" width="460" height="200" viewBox="0 0 460 200"><path d="M0 204 C 60 120, 150 90, 240 140 S 380 150, 470 40" fill="none" stroke="#2EE6C5" stroke-width="4"/></svg>
</section></body></html>
